# Add a site = add 3 lines. Point `url` at the institute's actual
# notices / announcements / admissions page (not just the homepage) for best results.
# These are STARTING POINTS - verify each URL in a browser and swap in the notice page.
keywords:
  - jrf
  - junior research fellow
  - ph.d
  - phd
  - research scholar
  - m.tech
  - mtech
  - m.sc
  - msc
  - ms (research)
  - ms by research
  - admission
  - applications invited
  - project associate
  - research associate
  - gate
exclude_keywords:
  - tender
  - quotation
  - holiday

