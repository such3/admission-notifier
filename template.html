<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admission Notifications – IIT · NIT · IIIT</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1c1c1a;--muted:#6b6b66;--line:#e4e4df;--accent:#2f5bea;--chip:#ececE7;--new:#d9480f}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--text:#ecece8;--muted:#9a9a93;--line:#2e2e2b;--accent:#7b9bff;--chip:#2a2a27;--new:#ff8a50}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:16px}
input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);padding:6px 12px;border-radius:999px;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{color:var(--muted);font-size:.85rem;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.tag{padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--text);font-weight:600}
.new{color:var(--new);font-weight:700}
.card a{color:var(--accent);text-decoration:none;font-weight:600;word-break:break-word}
.card a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Admission &amp; Fellowship Notifications</h1>
  <div class="sub" id="sub"></div>
  <input type="search" id="q" placeholder="Search title or institute…" autocomplete="off">
  <div class="chips" id="kinds"></div>
  <div class="chips" id="cats"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<script>
const DATA = __DATA__;
const META = __META__;
const state = {q:"", kind:"All", cat:"All"};
const $ = id => document.getElementById(id);
const kinds = ["All","IIT","NIT","IIIT"];
const cats = ["All","PhD","JRF","Masters","Project/RA","Other"];
const fmt = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); };
const isNew = iso => (Date.now() - new Date(iso).getTime()) < 48*3600*1000;

function chips(el, items, key){
  el.innerHTML = "";
  items.forEach(v => {
    const b = document.createElement("button");
    b.className = "chip" + (state[key] === v ? " on" : "");
    b.textContent = v;
    b.onclick = () => { state[key] = v; render(); };
    el.appendChild(b);
  });
}

function render(){
  chips($("kinds"), kinds, "kind");
  chips($("cats"), cats, "cat");
  const q = state.q.toLowerCase();
  const rows = DATA.filter(r =>
    (state.kind === "All" || r.kind === state.kind) &&
    (state.cat === "All" || r.category === state.cat) &&
    (!q || (r.title + " " + r.institute).toLowerCase().includes(q))
  ).sort((a,b) => (b.found_at||"").localeCompare(a.found_at||""));
  $("count").textContent = rows.length + " notification" + (rows.length === 1 ? "" : "s");
  const list = $("list"); list.innerHTML = "";
  if (!rows.length){ list.innerHTML = '<div class="empty">Nothing matches yet.</div>'; return; }
  rows.forEach(r => {
    const c = document.createElement("div"); c.className = "card";
    const m = document.createElement("div"); m.className = "meta";
    const add = (txt, cls) => { const s = document.createElement("span"); if (cls) s.className = cls; s.textContent = txt; m.appendChild(s); };
    add(r.kind, "tag"); add(r.institute); add(r.category, "tag");
    if (r.found_at) add("found " + fmt(r.found_at));
    if (r.found_at && isNew(r.found_at)) add("NEW", "new");
    const a = document.createElement("a"); a.href = r.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = r.title;
    c.appendChild(m); c.appendChild(a); list.appendChild(c);
  });
}
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("sub").textContent = "Last updated " + fmt(META.updated) + " · tracking " + META.sites + " institutes";
render();
</script>
</body>
</html>
